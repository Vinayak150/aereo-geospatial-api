services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - measurements:/data
    environment:
      AEREO_DATABASE_URL: sqlite:////data/aereo.db
      PROJ_NETWORK: "OFF"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  measurements:
