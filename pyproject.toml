[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aereo-geospatial-api"
version = "1.0.0"
description = "Bounded geospatial file processing with explicit projected measurements"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.0",
  "sqlalchemy==2.1.4",
  "python-multipart==0.0.32",
  "uvicorn==0.54.0",
  "shapely==2.2.0",
  "pyproj==3.8.0",
  "pyogrio==0.13.0",
  "numpy==2.5.4",
  "fastkml==1.4.0",
  "defusedxml==0.7.1",
  "lxml==6.1.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["app"]
